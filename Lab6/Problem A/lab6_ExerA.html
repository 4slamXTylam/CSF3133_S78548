<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>

    <!-- Link external CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Link external JavaScript -->
    <script src="game.js" defer></script>
</head>
<body>

    <!-- Game heading -->
    <header>
        <h1><em>Rock, Paper, Scissors</em> Showdown!</h1>
        <p>Play the classic game against the computer!</p>
    </header>

    <!-- Player section -->
    <section>
        <label for="playerName">Your name:</label>
        <input type="text" id="playerName" name="playerName">

        <button onclick="startGame()">Start Game</button>

        <p id="welcome"></p>
        <p id="startTime"></p>
    </section>

    <!-- Game section -->
    <section>
        <h2>Choose Your Move</h2>

        <button onclick="playRound('rock')">Rock</button>
        <button onclick="playRound('paper')">Paper</button>
        <button onclick="playRound('scissors')">Scissors</button>

        <!-- Player and computer images -->
        <div class="game-area">
            <h3>YOU</h3>
            <div class="player-section">
                <img id="playerImg" src="playerImg.png">
                <p id="playerChoice"></p>

                
            </div>

            <strong>VS</strong>
            
            <div class="computer-section">
              
                <img id="computerImg" src="computerImg.png">
                <p id="computerChoice"></p>
                <h3>COMPUTER </h3>
            </div>

        </div>

        <!-- Result -->
        <p id="result">Start the game to play.</p>
    </section>

    <!-- Result section -->
    <section>
        <p>
            Wins: <span id="wins">0</span>
            Losses: <span id="losses">0</span>
            Draws: <span id="draws">0</span>
        </p>
    </section>

    <!-- History section -->
    <section>
        <h2>History</h2>

        <table id="history">
            <thead>
                <tr>
                    <th>Round</th>
                    <th>You</th>
                    <th>Computer</th>
                    <th>Result</th>
                </tr>
            </thead>

            <tbody></tbody>
        </table>

        <button onclick="showSummary()">Show Summary</button>
        <button onclick="resetGame()">Reset</button>

        <p id="summary"></p>
    </section>

    <!-- Footer -->
    <footer>
        <p id="startTime"></p>
        <p>&copy; Computer Science Club</p>
    </footer>

</body>
</html>
